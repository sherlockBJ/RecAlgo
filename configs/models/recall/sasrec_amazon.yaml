# SASRec on Amazon Electronics — Kang & McAuley, Self-Attentive Sequential
# Recommendation, ICDM 2018.
#
# SASRec is a SEQUENTIAL recommender but — unlike DIN/DIEN — it is a TopK RANKING
# model (input_type PAIRWISE, BPR loss), NOT a CTR/AUC model. It outputs the
# classic ranking metrics (Recall/NDCG/Hit/MRR), so the eval protocol is the
# leave-one-out + sampled-ranking scheme the paper uses, NOT labeled AUC.
#
# Paper protocol: leave-one-out split (last item = test, 2nd-last = valid), then
# rank the ground-truth item against 100 sampled negatives, report HR@10 (=Hit@10)
# and NDCG@10. RecBole reproduces this with LS split + uni100 + topk [10].
#
# Target: HR@10 (~0.3-0.5) and NDCG@10 (~0.2-0.35) range. Exact numbers depend on
# dataset density; Amazon Electronics is not in the original paper table, so this
# is a benchmark sanity check, not an exact paper-table match.

gpu_id: '1'                     # pin to physical GPU1 (RecBole ignores shell CUDA_VISIBLE_DEVICES)

# ---------------------------------------------------------------------------
# Dataset fields + sequence config
# ---------------------------------------------------------------------------
load_col:
  inter: [user_id, item_id, rating, timestamp]

# Raw SNAP Amazon Electronics (7.8M ratings) is extremely sparse — RecBole's
# packaged dataset is 5-core filtered, so we reproduce that here. Required for
# sequential models: without it most users have too short a behavior sequence.
user_inter_num_interval: "[5,inf)"
item_inter_num_interval: "[5,inf)"

MAX_ITEM_LIST_LENGTH: 50
ITEM_LIST_LENGTH_FIELD: item_length
LIST_SUFFIX: _list

# ---------------------------------------------------------------------------
# Model hyper-parameters (RecBole SASRec defaults = paper settings)
# ---------------------------------------------------------------------------
n_layers: 2
n_heads: 2
hidden_size: 64
inner_size: 256
hidden_dropout_prob: 0.5
attn_dropout_prob: 0.5
hidden_act: gelu
layer_norm_eps: 1e-12
initializer_range: 0.02
loss_type: BPR                  # pairwise BPR (SASRec's input_type)

# ---------------------------------------------------------------------------
# Training (fast budget: epochs 50, patience 10)
# ---------------------------------------------------------------------------
epochs: 50
train_batch_size: 4096
learner: adam
learning_rate: 0.001
train_neg_sample_args:
  distribution: uniform
  sample_num: 1
stopping_step: 10
loss_decimal_place: 4
eval_step: 1

# ---------------------------------------------------------------------------
# Evaluation: leave-one-out + 100-negative sampled ranking, top-10
# ---------------------------------------------------------------------------
eval_args:
  split: {LS: valid_and_test}
  order: TO
  mode: uni100
  group_by: user
metrics: [Recall, NDCG, Hit, MRR]
topk: [10]
valid_metric: NDCG@10
eval_batch_size: 40960

seed: 2024
reproducibility: true
